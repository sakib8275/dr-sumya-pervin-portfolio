<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page Not Found — Dr. Sumya Pervin, MD</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .nf-wrap {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 32px 20px;
      text-align: center;
      font-family: 'Outfit', system-ui, sans-serif;
    }
    .nf-code { font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--grey, #7a7a7a); }
    .nf-wrap h1 { margin: 0; font-size: clamp(24px, 5vw, 34px); font-weight: 600; color: var(--sienna, #A9553D); }
    .nf-wrap p { margin: 0; max-width: 44ch; font-size: 15px; line-height: 1.6; color: var(--ink, #2c2c2c); }
  </style>
</head>
<body>
  <main class="nf-wrap">
    <span class="nf-code">Error 404</span>
    <h1>This page doesn't exist</h1>
    <p>The page you're looking for may have moved. You can return to the homepage to find chambers, services, and appointment booking.</p>
    <a class="btn btn-glass" href="/">Back to homepage</a>
  </main>
</body>
</html>
