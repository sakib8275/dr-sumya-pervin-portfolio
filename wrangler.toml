# Only public/ is published. This was "." — the repo root — which served the admin
# PIN hash, SITE_SECRET, and every internal doc as public assets. Anything that is
# not meant for patients must stay outside public/.
pages_build_output_dir = "public"

# Pins the Workers runtime semantics. Without this, wrangler defaults the date to
# *today*, which fails outright whenever the local wrangler is newer than the
# installed workerd ("requires compatibility date X, newest supported is Y") and,
# worse, silently shifts runtime behaviour as the date rolls forward. Bump this
# deliberately and re-test; never leave it unset.
compatibility_date = "2026-07-29"

[[d1_databases]]
binding = "DB"
database_name = "dr-sumya-pervin-db"
database_id = "local-dev-db-id"  # replace with the id printed by `wrangler d1 create`

[[r2_buckets]]
binding = "GALLERY_BUCKET"
bucket_name = "dr-sumya-gallery"

# JWT_SECRET and SITE_SECRET are secrets and must NOT be declared here — values in
# [vars] ship as plaintext and overwrite the dashboard on every deploy. Set them with:
#   npx wrangler pages secret put JWT_SECRET
#   npx wrangler pages secret put SITE_SECRET
# For local dev, put them in .dev.vars (gitignored).
[vars]
ALLOWED_ORIGIN = "https://drsumyapervin.com"
