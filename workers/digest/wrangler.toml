# F8 — the daily digest Worker. Deployed with `npx wrangler deploy` from THIS
# directory, not from the repo root: the root wrangler.toml is the Pages project
# and the two must never be merged. This Worker has no routes and no fetch
# handler; crons are its only trigger.
name = "dr-sumya-digest"
main = "index.js"

# No public URL. This Worker exports only scheduled(); a workers.dev route would
# publish a hostname that answers nothing useful and widens the surface for no
# reason. The same instinct as pages_build_output_dir in the root config.
workers_dev = false

# Matches the Pages project's date. The digest imports functions/lib/schedule.js,
# so a runtime-semantics split between the two would be a real divergence.
compatibility_date = "2026-07-29"

# Each chamber's booking cutoff, in UTC: DCIMCH closes 14:30 Dhaka (Sat–Wed) and
# Alliance 16:30 Dhaka (Sat–Thu), and the digest goes out the moment the list is
# final. Do NOT hand-edit these — they are derived from functions/lib/schedule.js
# by cronForChamber() in digest.js, and tests/digest.test.mjs fails if this file
# and that derivation disagree. Change the schedule there, then copy the values
# the test prints.
#
# Day-of-week is spelled, not numbered: Cloudflare's schedules API rejects
# "30 8 * * 0-3,6" with `10100: invalid cron string`. The numeric form this file
# originally shipped with would have failed at deploy every time.
[triggers]
crons = ["30 8 * * SUN-WED,SAT", "30 10 * * SUN-THU,SAT"]

# Read-only in practice: digest.js issues exactly one SELECT. The digest must
# never be able to write to the booking table.
[[d1_databases]]
binding = "DB"
database_name = "dr-sumya-pervin-db"
database_id = "d2ce7968-38ce-4329-86a9-b60d3b48f414"  # created 2026-07-30, region APAC

# Outbound email. Email Routing was enabled on the zone 2026-08-03 (status
# "ready"; MX + SPF + DKIM records created automatically), so this binding has a
# path out. Delivery still depends on the destination below being verified.
[[send_email]]
name = "EMAIL"

# Sender and recipient. Both must be set before a single mail can go out; with
# either blank the Worker logs "not configured" and returns without sending
# (see runDigest in digest.js) rather than emailing into the void.
#
#   DIGEST_FROM — an address on the zone. Email Routing is enabled here, which is
#                 what authorises the send_email binding to use it.
#   DIGEST_TO   — must be a VERIFIED destination. Added 2026-08-03 and VERIFIED
#                 the same day at 16:13 UTC, so the send path is open. If this
#                 ever changes to a fresh address, the new one starts
#                 unverified and every send fails with a "not verified" error,
#                 which runDigest logs as `send-failed`.
[vars]
DIGEST_FROM = "digest@drsumyapervin.com"
DIGEST_TO = "dr.enamtalha@gmail.com"

# Workers Logs. This Worker's only trigger is cron and its only output is an
# email nobody in this repo can read, so without logs a failed run is invisible:
# "no mail arrived" looks exactly like "no appointments to report". Enabled
# 2026-08-03, before the first real scheduled run, so that run leaves a trace
# either way. head_sampling_rate is 1 deliberately — two invocations a day is
# nothing to sample.
[observability]
enabled = true
head_sampling_rate = 1
